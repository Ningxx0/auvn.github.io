  const body = `
    <div class="form">
      <label class="field">
        <span class="lab">课程名称</span>
        <input type="text" id="f-name" value="${esc(draft.name)}" placeholder="例如：高等数学A(1)" autocomplete="off">
      </label>
      <div class="row2">
        <label class="field"><span class="lab">教师</span><input type="text" id="f-teacher" value="${esc(draft.teacher)}" placeholder="选填"></label>
        <label class="field"><span class="lab">地点</span><input type="text" id="f-room" value="${esc(draft.room)}" placeholder="选填"></label>
      </div>
      <div class="field">
        <span class="lab">上课日</span>
        <div class="chips days" id="f-days">
          ${DAY_NAMES.map(
            (n, i) => `<button class="chip ${draft.day === i + 1 ? 'on' : ''}" data-day="${i + 1}">${n}</button>`
          ).join('')}
        </div>
      </div>
      <div class="row2">
        <label class="field"><span class="lab">开始节次</span>
          <select id="f-start">${secs.map((s, i) => `<option value="${i + 1}" ${draft.start === i + 1 ? 'selected' : ''}>第${i + 1}节 ${esc(s.s)}</option>`).join('')}</select>
        </label>
        <label class="field"><span class="lab">结束节次</span>
          <select id="f-end">${secs.map((s, i) => `<option value="${i + 1}" ${draft.end === i + 1 ? 'selected' : ''}>第${i + 1}节 ${esc(s.e)}</option>`).join('')}</select>
        </label>
      </div>
      <div class="field">
        <span class="lab">上课周次 <span id="f-weekcount" style="letter-spacing:0;text-transform:none;font-weight:600"></span></span>
        <div class="chips weeks" id="f-weeks">
          ${Array.from({ length: maxW }, (_, i) => `<button class="chip ${draft.weeks.includes(i + 1) ? 'on' : ''}" data-week="${i + 1}">${i + 1}</button>`).join('')}
        </div>
        <div class="quick" id="f-quick">
          <button data-q="all">全选</button><button data-q="odd">单周</button><button data-q="even">双周</button>
          <button data-q="1-8">1-8</button><button data-q="9-16">9-16</button><button data-q="none">清空</button>
        </div>
      </div>
      <div class="field">
        <span class="lab">颜色</span>
        <div class="swatches" id="f-colors">
          ${HUES.map((h) => `<button class="sw ${draft.hue === h ? 'on' : ''}" data-hue="${h}" style="--h:${h}" aria-label="颜色 ${h}"></button>`).join('')}
        </div>
      </div>
    </div>`;

  const footer = isEdit
    ? `<button class="btn danger" id="f-del" style="flex:0 0 42%">删除</button><button class="btn primary" id="f-save">保存</button>`
    : `<button class="btn ghost" id="f-cancel">取消</button><button class="btn primary" id="f-save">添加课程</button>`;

  openSheet({
    title: isEdit ? '编辑课程' : '添加课程',
    subtitle: isEdit ? formatWeeks(draft.weeks) : '填写课程信息，或从课表导入',
    body,
    footer,
    onMount(sheet, close) {
      const bodyEl = $('.sheet-body', sheet);
      const nameInput = $('#f-name', bodyEl);
      const weekChips = $$('#f-weeks .chip', bodyEl);
      const countEl = $('#f-weekcount', bodyEl);
      let day = draft.day;
      let hue = draft.hue;

      const refreshCount = () => {
        const n = weekChips.filter((b) => b.classList.contains('on')).length;
        countEl.textContent = n ? `· 已选 ${n} 周` : '· 未选择';
      };
      refreshCount();

      $$('#f-days .chip', bodyEl).forEach((btn) => {
        btn.addEventListener('click', () => {
          day = Number(btn.dataset.day);
          $$('#f-days .chip', bodyEl).forEach((b) => b.classList.toggle('on', b === btn));
        });
      });

      weekChips.forEach((btn) => {
        btn.addEventListener('click', () => {
          btn.classList.toggle('on');
          refreshCount();
        });
      });

      $$('#f-quick button', bodyEl).forEach((btn) => {
        btn.addEventListener('click', () => {
          const q = btn.dataset.q;
          weekChips.forEach((b) => {
            const w = Number(b.dataset.week);
            if (q === 'all') b.classList.add('on');
            else if (q === 'none') b.classList.remove('on');
            else if (q === 'odd') b.classList.toggle('on', w % 2 === 1);
            else if (q === 'even') b.classList.toggle('on', w % 2 === 0);
            else if (q === '1-8') b.classList.toggle('on', w >= 1 && w <= 8);
            else if (q === '9-16') b.classList.toggle('on', w >= 9 && w <= 16);
          });
          refreshCount();
        });
      });

      let colorLocked = isEdit; // 手动选过颜色后，改课程名不再自动换色

      $$('#f-colors .sw', bodyEl).forEach((btn) => {
        btn.addEventListener('click', () => {
          hue = Number(btn.dataset.hue);
          colorLocked = true;
          $$('#f-colors .sw', bodyEl).forEach((b) => b.classList.toggle('on', b === btn));
        });
      });

      $('#f-name', bodyEl)?.addEventListener('input', (e) => {
        if (colorLocked) return;
        // 新建课程时按名称自动配色，输入过程中保持同一色系
        hue = hueForName(e.target.value || '');
        $$('#f-colors .sw', bodyEl).forEach((b) => b.classList.toggle('on', Number(b.dataset.hue) === hue));
      });

      if (isEdit) {
        $('#f-del', sheet).addEventListener('click', () => {
          if (!confirm(`删除「${draft.name}」？`)) return;
          state.courses = state.courses.filter((c) => c.id !== draft.id);
          saveState();
          close();
          render();
          toast('已删除');
        });
      } else {
        $('#f-cancel', sheet).addEventListener('click', close);
      }

      $('#f-save', sheet).addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) {
          toast('请填写课程名称');
          nameInput.focus();
          return;
        }
        const weeks = weekChips.filter((b) => b.classList.contains('on')).map((b) => Number(b.dataset.week));
        if (!weeks.length) {
          toast('请至少选择一个上课周次');
          return;
        }
        let start = Number($('#f-start', bodyEl).value);
        let end = Number($('#f-end', bodyEl).value);
        if (end < start) [start, end] = [end, start];
        const courseObj = {
          id: draft.id,
          name,
          teacher: $('#f-teacher', bodyEl).value.trim(),
          room: $('#f-room', bodyEl).value.trim(),
          day,
          start,
          end,
          weeks,
          hue,
          note: draft.note || '',
        };
        if (isEdit) {
          state.courses = state.courses.map((c) => (c.id === draft.id ? courseObj : c));
        } else {
          state.courses.push(courseObj);
        }
        saveState();
        close();
        render();
        toast(isEdit ? '已保存' : '已添加');
      });
    },
  });
}

/* ---------------- 导入 ---------------- */
function openImport(prefill = '') {
  const body = `
    <label class="field">
      <span class="lab">粘贴内容</span>
      <textarea id="imp-text" spellcheck="false" placeholder="① 在电脑上打开教务系统课表页面，全选复制后粘贴到这里&#10;② 也可以粘贴 CSV、JSON 备份">${esc(prefill)}</textarea>    </label>
    <div class="quick" style="margin-top:-2px">
      <button id="imp-file">选择文件…</button>
      <button id="imp-sample">填入示例</button>
      <button id="imp-clear">清空</button>
    </div>
    <div class="preview" id="imp-preview" hidden></div>
    <div class="radio-row" id="imp-mode">
      <label><input type="radio" name="impmode" value="append" checked> 追加</label>
      <label><input type="radio" name="impmode" value="replace"> 替换全部</label>
    </div>
    <label class="switch-row" id="imp-meta-row" hidden style="margin-top:6px">
      <div>同时恢复学期设置<small>开学日期、节次时间、课前提醒</small></div>
      <input class="switch" type="checkbox" id="imp-meta" checked>
    </label>
    <p class="helper">粘贴时会自动读取剪贴板里的网页结构（最准）；也支持被拍平成文本的课表、CSV 和 JSON。导入后请检查周次与节次，可在课表里点课程修改。</p>
    <input type="file" id="imp-fileinput" accept=".json,.csv,.txt,.html,.htm,text/*" hidden>`;

  openSheet({
    title: '导入课表',
    subtitle: '从教务系统粘贴，或导入备份文件',
    body,
    footer: `<button class="btn primary" id="imp-do" disabled>导入</button>`,
    onMount(sheet, close) {
      const bodyEl = $('.sheet-body', sheet);
      const ta = $('#imp-text', bodyEl);
      const preview = $('#imp-preview', bodyEl);
      const doBtn = $('#imp-do', sheet);
      let parsed = null;
      let pastedHtml = '';

      const showPreview = () => {
        if (!parsed) {
          preview.hidden = true;
          doBtn.disabled = true;
          return;
        }
        const { courses, warnings, format } = parsed;
        const label = { html: '教务系统页面', grid: '纯文本课表', csv: 'CSV 表格', json: 'JSON 数据' }[format] || '文本';
        const rows = courses.slice(0, 6).map(
          (c) =>
            `<li><i>${DAY_NAMES[c.day - 1]} ${c.start}-${c.end}节</i><span>${esc(c.name)}</span></li>`
        );
        preview.hidden = false;
        preview.innerHTML = courses.length
          ? `<h4><span class="ok">✓</span> 识别到 ${courses.length} 门课程 · ${label}</h4>
             <ul>${rows.join('')}${courses.length > 6 ? `<li><i>…</i><span>还有 ${courses.length - 6} 门</span></li>` : ''}</ul>
             ${warnings.length ? `<div class="warn">${esc(warnings.slice(0, 3).join(' '))}</div>` : ''}`
          : `<h4>没有识别出课程</h4><div class="warn">${esc(warnings[0] || '请检查粘贴的内容是否完整。')}</div>`;
        doBtn.disabled = courses.length === 0;
        const metaRow = $('#imp-meta-row', bodyEl);
        if (metaRow) metaRow.hidden = !(parsed.meta && parsed.meta.start);
      };

      const runParse = () => {
        const text = pastedHtml || ta.value.trim();
        if (!text) {
          parsed = null;
          showPreview();
          return;
        }
        try {
          parsed = parseAnything(text);
        } catch (err) {
          parsed = { courses: [], warnings: ['解析失败：' + err.message], format: 'text' };
        }
        showPreview();
      };

      // 网页课表复制过来时，剪贴板里同时有 HTML 与纯文本。
      // textarea 只能拿到纯文本，所以这里直接读 text/html，解析精度最高。
      ta.addEventListener('paste', (e) => {
        const html = e.clipboardData ? e.clipboardData.getData('text/html') : '';
        if (html && /<table|<tr|<td/i.test(html)) {
          e.preventDefault();
          pastedHtml = html;
          ta.value = `（已捕获网页表格结构，共 ${html.length} 字符）\n直接点「导入」即可，无需再手动整理。`;
          runParse();
        }
      });

      let timer = 0;
      ta.addEventListener('input', () => {
        pastedHtml = '';
        clearTimeout(timer);
        timer = setTimeout(runParse, 360);
      });

      $('#imp-file', bodyEl).addEventListener('click', () => $('#imp-fileinput', bodyEl).click());
      $('#imp-fileinput', bodyEl).addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          pastedHtml = '';
          ta.value = String(reader.result || '');
          runParse();
        };
        reader.readAsText(file);
      });
      $('#imp-sample', bodyEl).addEventListener('click', () => {
        pastedHtml = '';
        ta.value = SAMPLE_HTML;
        runParse();
      });
      $('#imp-clear', bodyEl).addEventListener('click', () => {
        pastedHtml = '';
        ta.value = '';
        parsed = null;
        showPreview();
      });

      doBtn.addEventListener('click', () => {
        if (!parsed || !parsed.courses.length) return;
        const mode = $('input[name="impmode"]:checked', bodyEl)?.value || 'append';
        const imported = parsed.courses.map((c) => ({
          id: uid(),
          name: c.name,
          teacher: c.teacher || '',
          room: c.room || '',
          day: c.day,
          start: c.start,
          end: c.end,
          weeks: c.weeks?.length ? c.weeks : parseWeeks('1-16'),
          hue: Number.isFinite(c.hue) ? c.hue : hueForName(c.name),
          note: c.note || '',
        }));
        if (mode === 'replace') state.courses = imported;
        else {
          const seen = new Set(
            state.courses.map((c) => [c.name, c.day, c.start, c.end, c.weeks.join(','), c.room].join('|'))
          );
          imported.forEach((c) => {
            const key = [c.name, c.day, c.start, c.end, c.weeks.join(','), c.room].join('|');
            if (!seen.has(key)) {
              seen.add(key);
              state.courses.push(c);
            }
          });
        }
        const restoreMeta = parsed.meta && $('#imp-meta', bodyEl) && $('#imp-meta', bodyEl).checked;
        if (restoreMeta) {
          applyImportedMeta(parsed.meta);
          applyTheme();
        }
        // 学校节次比设置多时自动补足，避免第 12 节的课被丢掉
        ensureSections(state.meta.sections, imported.reduce((m, c) => Math.max(m, c.end), 0));
        saveState();
        close();
        viewWeek = clamp(currentWeek(), 1, maxWeek());
        render();
        toast(`已导入 ${imported.length} 门课程${restoreMeta ? '，并恢复学期设置' : ''}`);
      });

      if (prefill) setTimeout(runParse, 60);
      setTimeout(() => ta.focus(), 400);
    },
  });
}

/* ---------------- 设置 ---------------- */
function openSettings() {
  const m = state.meta;
  const seg = ['auto', 'light', 'dark']
    .map((k) => {
      const label = { auto: '跟随系统', light: '浅色', dark: '深色' }[k];
      return `<button data-theme="${k}" class="${(m.theme || 'auto') === k ? 'on' : ''}">${label}</button>`;
    })
    .join('');
  const secRows = m.sections
    .map(
      (s, i) => `<div class="sec-row">
        <label>第${i + 1}节</label>
        <input type="time" data-k="s" data-i="${i}" value="${s.s}">
        <input type="time" data-k="e" data-i="${i}" value="${s.e}">
      </div>`
    )
    .join('');

  const body = `
    <label class="field"><span class="lab">学期名称</span>
      <input type="text" id="s-name" value="${esc(m.name)}" placeholder="2026 秋季学期">
    </label>
    <label class="field"><span class="lab">第 1 周的周一</span>
      <input type="date" id="s-start" value="${esc(m.start)}">
    </label>
    <div class="field">
      <span class="lab">主题</span>
      <div class="seg" id="s-theme">${seg}</div>
    </div>
    <div class="field" style="padding:2px 13px">
      <div class="switch-row">
        <div>显示周末<small>周六、周日也显示在课表里</small></div>
        <input class="switch" type="checkbox" id="s-weekend" ${m.showWeekend ? 'checked' : ''}>
      </div>
    </div>
    <div class="field" style="padding:2px 13px">
      <div class="switch-row">
        <div>每天节数<small>课表显示几行，11 节就填 11</small></div>
        <div class="stepper">
          <button id="s-dec" aria-label="减少一节">−</button>
          <span id="s-count">${m.sections.length}</span>
          <button id="s-inc" aria-label="增加一节">+</button>
        </div>
      </div>
    </div>
    <div class="field">
      <span class="lab">节次时间</span>
      <div id="s-sections">${secRows}</div>
      <p class="helper">修改后会同步调整课表网格与时间提示。</p>
    </div>
    <div class="field">
      <span class="lab">课前提醒</span>
      <div class="quick" style="margin-top:2px">
        <button id="s-remind">设置提醒时间 / 同步到日历</button>
      </div>
      <p class="helper">当前：${m.reminder > 0 ? `课前 ${m.reminder} 分钟提醒` : '已关闭'}（导出到系统日历后生效）</p>
    </div>
    <div class="field">
      <span class="lab">数据</span>
      <div class="quick" style="margin-top:2px">
        <button id="s-export">导出备份</button>
        <button id="s-import">导入备份</button>
        <button id="s-demo">载入示例</button>
        <button id="s-clear" style="color:var(--danger);background:rgba(224,52,43,.1)">清空课程</button>
      </div>
      <p class="helper">数据只保存在本机浏览器里。换手机或清理浏览器前，记得先导出备份。</p>
    </div>
    <p class="helper" style="text-align:center;margin:14px 0 4px">
      课程表 v1.1 · 适配 iPhone 17 / iOS 27<br>
      添加到主屏幕即可全屏使用；桌面小组件见 Scriptable 脚本
    </p>`;

  openSheet({
    title: '设置',
    subtitle: '学期、外观与节次时间',
    body,
    footer: `<button class="btn primary" id="s-save">完成</button>`,
    onMount(sheet, close) {
      const bodyEl = $('.sheet-body', sheet);
      let draftSections = m.sections.map((x) => ({ ...x }));

      const rowHtml = (s, i) => `<div class="sec-row">
        <label>第${i + 1}节</label>
        <input type="time" data-k="s" data-i="${i}" value="${s.s}">
        <input type="time" data-k="e" data-i="${i}" value="${s.e}">
      </div>`;

      const readRows = () => {
        const rows = $$('#s-sections .sec-row', bodyEl);
        if (!rows.length) return;
        draftSections = rows.map((row) => ({
          s: row.querySelector('[data-k="s"]').value || '08:00',
          e: row.querySelector('[data-k="e"]').value || '08:45',
        }));
      };

      const renderRows = () => {
        $('#s-sections', bodyEl).innerHTML = draftSections.map(rowHtml).join('');
        $('#s-count', bodyEl).textContent = String(draftSections.length);
      };

      const setCount = (delta) => {
        readRows();
        const n = clamp(draftSections.length + delta, 6, 16);
        if (n === draftSections.length) return;
        if (n < draftSections.length) {
          const busy = state.courses.filter((c) => Number(c.end) > n || Number(c.start) > n);
          if (busy.length) {
            toast(`第 ${n + 1} 节还有 ${busy.length} 门课，先把它们改到前面几节`);
            return;
          }
          draftSections = draftSections.slice(0, n);
        } else {
          while (draftSections.length < n) {
            const last = draftSections[draftSections.length - 1] || { s: '08:00', e: '08:45' };
            const startAt = minutes(last.e) + 10;
            draftSections.push({ s: fmtMinutes(startAt), e: fmtMinutes(startAt + 45) });
          }
        }
        renderRows();
      };

      $('#s-dec', bodyEl).addEventListener('click', () => setCount(-1));
      $('#s-inc', bodyEl).addEventListener('click', () => setCount(1));

      $$('#s-theme button', bodyEl).forEach((btn) => {
        btn.addEventListener('click', () => {
          $$('#s-theme button', bodyEl).forEach((b) => b.classList.toggle('on', b === btn));
          state.meta.theme = btn.dataset.theme;
          applyTheme();
          saveState();
        });
      });
      $('#s-weekend', bodyEl).addEventListener('change', (e) => {
        state.meta.showWeekend = e.target.checked;
        saveState();
        renderBoard({ scrollToNow: false });
        renderToday();
      });
      $('#s-export', bodyEl).addEventListener('click', () => openExport());
      $('#s-import', bodyEl).addEventListener('click', () => openImport());
      $('#s-demo', bodyEl).addEventListener('click', () => {
        if (state.courses.length && !confirm('载入示例会覆盖当前课程，继续？')) return;
        state = demoState();
        saveState();
        viewWeek = clamp(currentWeek(), 1, maxWeek());
        close();
        render();
        toast('已载入示例课表');
      });
      $('#s-clear', bodyEl).addEventListener('click', () => {
        if (!confirm('清空全部课程？此操作不可撤销。')) return;
        state.courses = [];
        saveState();
        close();
        render();
        toast('已清空');
      });
      $('#s-remind', bodyEl).addEventListener('click', () => openReminder());
      $('#s-save', sheet).addEventListener('click', () => {
        const name = $('#s-name', bodyEl).value.trim();
        const start = $('#s-start', bodyEl).value;
        readRows();
        const sections = draftSections;
        const bad = sections.some((x) => minutes(x.e) <= minutes(x.s));
        if (bad) {
          toast('有节次的结束时间早于开始时间');
          return;
        }
        state.meta.name = name || '我的课表';
        if (/^\d{4}-\d{2}-\d{2}$/.test(start)) state.meta.start = start;
        state.meta.sections = sections;
        saveState();
        close();
        viewWeek = clamp(viewWeek, 1, maxWeek());
        render();
        toast('设置已保存');
      });
    },
  });
}

/* ---------------- 导出 ---------------- */
function exportPayload() {
  return JSON.stringify(
    { version: 3, app: 'kcb', exportedAt: new Date().toISOString(), meta: state.meta, courses: state.courses },
    null,
    2
  );
}

function openExport() {
  const json = exportPayload();
  const body = `
    <label class="field">
      <span class="lab">备份内容</span>
      <textarea id="exp-text" readonly>${esc(json)}</textarea>
    </label>
    <div class="btn-stack">
      <button class="btn ghost small" id="exp-copy">复制到剪贴板</button>
      <button class="btn ghost small" id="exp-download">下载 .json 文件</button>
    </div>
    <p class="helper">把这份 JSON 存到「文件」App，或直接保存到 iCloud，换机后可一键恢复。</p>`;
  openSheet({
    title: '导出备份',
    subtitle: `${state.courses.length} 门课程 · ${state.meta.name}`,
    body,
    footer: `<button class="btn primary" id="exp-close">完成</button>`,
    onMount(sheet, close) {
      const ta = $('#exp-text', sheet);
      const copy = async (text) => {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {
          ta.select();
          ta.setSelectionRange(0, text.length);
          return document.execCommand('copy');
        }
      };
      $('#exp-copy', sheet).addEventListener('click', async () => {
        const ok = await copy(json);
        toast(ok ? '已复制备份内容' : '复制失败，请长按选择');
      });
      $('#exp-download', sheet).addEventListener('click', () => {
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `课程表备份-${isoDate(new Date())}.json`;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        toast('已生成文件');
      });
      $('#exp-close', sheet).addEventListener('click', close);
    },
  });
}

/* ---------------- 课前提醒（写入系统日历） ---------------- */
function openReminder() {
  const LEADS = [0, 5, 10, 15, 20, 30];
  const current = Number(state.meta.reminder) || 0;
  const count = planEvents(state.meta, state.courses).length;
  const subtitle = () => `当前：${state.meta.reminder > 0 ? `课前 ${state.meta.reminder} 分钟` : '关闭'}`;

  const body = `
    <div class="field">
      <span class="lab">提前多久提醒</span>
      <div class="chips grid3" id="r-leads">
        ${LEADS.map(
          (v) => `<button class="chip ${v === current ? 'on' : ''}" data-lead="${v}">${v ? `${v} 分钟` : '关闭'}</button>`
        ).join('')}
      </div>
    </div>
    <div class="preview" style="margin-top:4px">
      <h4>为什么不是 App 推送</h4>
      <p style="margin:0;line-height:1.65;font-size:12px">
        iPhone 不允许网页在后台定时弹通知（那需要服务器推送）。
        所以这里把课程写成<b>日历日程</b>，加进系统「日历」后由 iOS 负责提醒 ——
        锁屏、耳机、手表都会响，也不需要一直开着这个网页。
      </p>
    </div>
    <div class="btn-stack" style="margin-top:12px">
      <button class="btn primary" id="r-add">添加到系统日历</button>
      <button class="btn ghost small" id="r-dl">下载 .ics 文件</button>
    </div>
    <p class="helper">共 <b>${count}</b> 个日程，按周自动重复到学期末；课程有改动时重新导出一次即可。</p>
    <p class="helper">iOS 第一次会问「添加全部日程」，确认即可。重复导入会产生重复日程，建议先把旧的「课程表」日历删掉。</p>`;

  openSheet({
    title: '课前提醒',
    subtitle: subtitle(),
    body,
    footer: `<button class="btn primary" id="r-done">完成</button>`,
    onMount(sheet, close) {
      const bodyEl = $('.sheet-body', sheet);
      const headSub = $('.sheet-head p', sheet);

      $$('#r-leads .chip', bodyEl).forEach((btn) => {
        btn.addEventListener('click', () => {
          state.meta.reminder = Number(btn.dataset.lead);
          $$('#r-leads .chip', bodyEl).forEach((b) => b.classList.toggle('on', b === btn));
          saveState();
          headSub.textContent = subtitle();
        });
      });

      const icsText = () => buildICS(state.meta, state.courses, state.meta.reminder);
      const fileName = '课程表.ics';
      const download = () => {
        const blob = new Blob([icsText()], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      };

      $('#r-add', bodyEl).addEventListener('click', async () => {
        if (state.meta.reminder === 0) {
          toast('提醒已关闭，导入后不会响');
        }
        try {
          const file = new File([icsText()], fileName, { type: 'text/calendar' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: '课程表' });
            return;
          }
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
        download();
        toast('已下载 课程表.ics');
      });

      $('#r-dl', bodyEl).addEventListener('click', () => {
        download();
        toast('已生成 课程表.ics');
      });
      $('#r-done', sheet).addEventListener('click', close);
    },
  });
}

/* ---------------- 主题 ---------------- */
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme() {
  const pref = state?.meta?.theme || 'auto';
  const dark = pref === 'dark' || (pref === 'auto' && darkQuery.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#07080d' : '#f3f4f9');
}
darkQuery.addEventListener('change', () => {
  if ((state?.meta?.theme || 'auto') === 'auto') applyTheme();
});

/* ---------------- 事件 ---------------- */
function bindEvents() {
  $('#btnAdd').addEventListener('click', () => openEditor(null));
  $('#btnSettings').addEventListener('click', openSettings);
  $('#btnImport').addEventListener('click', () => openImport());
  $('#btnPrev').addEventListener('click', () => {
    viewWeek = clamp(viewWeek - 1, 1, Math.max(maxWeek(), viewWeek));
    renderHeader();
    renderToday();
    renderBoard({ scrollToNow: true });
  });
  $('#btnNext').addEventListener('click', () => {
    viewWeek = clamp(viewWeek + 1, 1, Math.max(maxWeek(), viewWeek + 1));
    renderHeader();
    renderToday();
    renderBoard({ scrollToNow: true });
  });
  $('#btnToday').addEventListener('click', () => {
    viewWeek = clamp(currentWeek(), 1, maxWeek());
    render();
    toast(`第 ${viewWeek} 周`);
  });
  $('#board').addEventListener('click', (e) => {
    const btn = e.target.closest('.course');
    if (btn) {
      const course = state.courses.find((c) => c.id === btn.dataset.id);
      if (course) openEditor(course);
      return;
    }
    if (e.target.closest('#emptyImport')) openImport();
    else if (e.target.closest('#emptyAdd')) openEditor(null);
    else if (e.target.closest('#emptyDemo')) {
      state = demoState();
      saveState();
      viewWeek = clamp(currentWeek(), 1, maxWeek());
      render();
      toast('已载入示例课表');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && closeSheet) closeSheet();
  });
  // 左右滑动切换周（在课表区域横向手势）
  let touchX = 0;
  let touchY = 0;
  $('#board').addEventListener(
    'touchstart',
    (e) => {
      if (e.touches.length !== 1) return;
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    },
    { passive: true }
  );
  $('#board').addEventListener(
    'touchend',
    (e) => {
      if (e.touches.length) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchX;
      const dy = t.clientY - touchY;
      if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      if (dx < 0) $('#btnNext').click();
      else $('#btnPrev').click();
    },
    { passive: true }
  );

  // 旋转屏幕 / 窗口尺寸变化时重新计算行高，保证还是一屏
  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!state.courses.length) return;
      renderBoard({ scrollToNow: false });
    }, 160);
  });
}

/* ---------------- 启动 ---------------- */
function boot() {
  const params = new URLSearchParams(location.search);
  const root = document.documentElement;
  root.dataset.booting = '1';
  if (params.get('still')) root.dataset.still = '1';
  if (params.get('reset')) {
    try {
      localStorage.removeItem(STORE_KEY);
    } catch (err) {}
  }
  state = loadState();
  if (!state) {
    state = params.get('demo') ? demoState() : newState();
  } else if (params.get('demo')) {
    state = demoState();
  }
  if (!state.meta.sections || !state.meta.sections.length) state.meta.sections = defaultMeta().sections;
  const themeParam = params.get('theme');
  if (themeParam === 'dark' || themeParam === 'light') state.meta.theme = themeParam;
  // 调试用：?sections=11 临时裁剪节数，方便检查一屏是否放得下
  const sectionsParam = Number(params.get('sections'));
  if (sectionsParam >= 6 && sectionsParam <= 16 && sectionsParam !== state.meta.sections.length) {
    state.meta.sections = state.meta.sections.slice(0, sectionsParam);
  }
  viewWeek = clamp(currentWeek(), 1, maxWeek());
  const weekParam = Number(params.get('week'));
  if (weekParam > 0) viewWeek = clamp(weekParam, 1, maxWeek());
  applyTheme();
  render();
  bindEvents();
  requestAnimationFrame(() => requestAnimationFrame(() => delete root.dataset.booting));

  const open = params.get('open');
  if (open === 'settings') openSettings();
  else if (open === 'import') openImport();
  else if (open === 'add') openEditor(null);
  else if (open === 'export') openExport();
  else if (open === 'reminder') openReminder();
  else if (state.courses[0] && open === 'edit') openEditor(state.courses[0]);

  if (params.get('debug')) {
    const btn = $('.icon-btn');
    const cs = btn ? getComputedStyle(btn) : null;
    const root = getComputedStyle(document.documentElement);
    document.title = `T=${document.documentElement.dataset.theme} BG=${cs && cs.backgroundColor} PANEL=${root
      .getPropertyValue('--panel')
      .trim()} BF=${cs && cs.backdropFilter} W=${innerWidth} B=${$('#board').scrollHeight}/${$('#board').clientHeight}`;
  }

  if (params.get('export')) {
    const pre = document.createElement('pre');
    pre.id = 'export-json';
    pre.textContent = exportPayload();
    document.body.textContent = '';
    document.body.append(pre);
  }

  if (params.get('selftest')) {
    const log = [];
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const importText = async (text, mode = 'replace') => {
      openImport();
      await wait(120);
      const ta = $('#imp-text');
      ta.value = text;
      ta.dispatchEvent(new Event('input'));
      await wait(700);
      const parsedOk = !$('#imp-do').disabled;
      const radio = $(`input[name="impmode"][value="${mode}"]`);
      if (radio) radio.checked = true;
      $('#imp-do').click();
      await wait(600);
      return parsedOk;
    };
    (async () => {
      try {
        // 旧版（v2）备份：courses + meta 都要能恢复
        const backup = JSON.stringify({
          version: 2,
          meta: {
            name: '备份学期',
            start: '2026-09-07',
            showWeekend: false,
            theme: 'auto',
            reminder: 15,
            sections: Array.from({ length: 11 }, (_, i) => ({ s: `${String(8 + i).padStart(2, "0")}:00`, e: `${String(8 + i).padStart(2, "0")}:45` })),
          },
          courses: [
            { id: 'b1', name: '备份高数', day: 1, start: 1, end: 2, weeks: [1, 2, 3], room: 'A101', hue: 214 },
            { id: 'b2', name: '备份英语', day: 3, start: 3, end: 4, weeks: [1, 2, 3], room: 'B202', hue: 30 },
          ],
        });
        log.push(`backupParsed=${await importText(backup)}`);
        log.push(`meta=${state.meta.sections.length}节/提醒${state.meta.reminder}/${state.meta.name}`);
        log.push(`backupCourses=${state.courses.length}`);

        log.push(`htmlParsed=${await importText(SAMPLE_HTML)}`);
        log.push(`imported=${state.courses.length}`);
        log.push(`blocks=${$$('.course').length}`);

        openEditor(null);
        await wait(120);
        $('#f-name').value = '自测课程';
        $('#f-save').click();
        await wait(300);
        log.push(`added=${state.courses.length}`);
        openSettings();
        await wait(200);
        const secBefore = state.meta.sections.length;
        $('#s-dec').click();
        await wait(60);
        $('#s-save').click();
        await wait(320);
        log.push(`sections=${secBefore}->${state.meta.sections.length}`);
        const before = viewWeek;
        $('#btnNext').click();
        await wait(200);
        log.push(`week=${before}->${viewWeek}`);
        log.push(`range=${$('#range').textContent.trim()}`);
        let saved = false;
        try {
          saved = !!localStorage.getItem(STORE_KEY);
        } catch (e) {}
        log.push(`saved=${saved}`);
        document.title = `SELFTEST ${log.join(' | ')}`;
      } catch (err) {
        document.title = `SELFTEST ERR ${err.message} :: ${log.join(' | ')}`;
      }
    })();
  }

  tickTimer = setInterval(() => {
    if (document.hidden) return;
    if (viewWeek !== currentWeek()) return;
    const board = $('#board');
    if (!board) return;
    const secs = state.meta.sections;
    const layout = buildLayout(secs);
    const offset = nowOffset(layout, secs);
    const line = $('#nowline');
    if (line && offset != null) line.style.top = `${offset.toFixed(1)}px`;
    renderToday();
  }, 60000);
  window.addEventListener('beforeunload', () => clearInterval(tickTimer));
}

boot();
